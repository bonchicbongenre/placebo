<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push button for walk signal.</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/tokens.css?5">
<style>
body{--w:clamp(6rem,min(22svh,40vw),10rem);margin:0;padding:3rem 16px;background:var(--paper);color:var(--ink);font:19px/1.5 var(--book);font-variant-numeric:oldstyle-nums}
main{max-width:calc(var(--w)*2.1 + .6rem + 2px);margin:0 auto}
p{margin:0;line-height:1.35}
#sign{width:calc(var(--w)*.8);box-sizing:border-box;margin-bottom:calc(var(--w)*.62 + 2rem);border:2px solid;padding:.4em .3em;font:calc(var(--w)*.09)/1.3 var(--sans);letter-spacing:.06em;text-align:center}
.t{font-size:1.1rem}
.m{font-variant-caps:all-small-caps;letter-spacing:.04em}
.d{font-variant-numeric:lining-nums tabular-nums}
.l{margin:.5rem 0 2rem}
a{color:var(--amber-accent);text-underline-offset:.15em}
</style>
</head>
<body>
<main>
<p id="sign">PUSH BUTTON<br>FOR<br>WALK SIGNAL</p>
<p class="t">404</p>
<p class="m">a sign</p>
<p>2026</p>
<p class="d">1,212 bytes</p>
<p class="l">Wait.</p>
<p><a href="/">doesthisdoanything.click</a></p>
</main>
</body>
</html>
