<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push button for walk signal.</title>
<meta name="description" content="Wait.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="tokens.css?5">
<style>
body{--w:clamp(6rem,min(22svh,40vw),10rem);--lit:oklch(.7 var(--amber,0 0));margin:0;padding:3rem 16px 1.4rem;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:19px/1.5 var(--book);font-variant-numeric:oldstyle-nums}
main,.by{width:100%;max-width:calc(var(--w)*2.1 + .6rem + 2px);margin:0 auto}
main{flex:1}
p{margin:0}
.corner{display:flex;align-items:flex-end;gap:calc(var(--w)*.3)}
#head{width:var(--w);padding:.3rem;display:grid;gap:.3rem;background:light-dark(oklch(.78 var(--gold,0 0)),oklch(.22 var(--jian,0 0)));border:1px solid light-dark(oklch(.6 var(--gold,0 0)),oklch(.3 var(--jian,0 0)));transition:background-color .5s ease,border-color .5s ease}
#head svg{display:block;width:100%;background:oklch(.16 var(--jian,0 0))}
#head g g{clip-path:url(#dots)}
.dont{color:oklch(.29 var(--amber,0 0))}
.walk{color:oklch(.29 var(--ding,0 0))}
[data-lit=dont] .dont{color:var(--lit)}
[data-lit=walk] .walk{color:oklch(.88 var(--ding,0 0))}
[data-lit=dont] .dont>g,[data-lit=walk] .walk>g{filter:url(#glow)}
.post{width:calc(var(--w)*.8);display:grid;gap:calc(var(--w)*.12)}
#sign{border:2px solid var(--ink);padding:.4em .3em;font:calc(var(--w)*.09)/1.3 var(--sans);letter-spacing:.06em;text-align:center}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--rule);outline-offset:4px}
#push,#lamp{aspect-ratio:1;border-radius:50%}
#push{width:calc(var(--w)*.5);justify-self:center;border:2px solid var(--ink);background:var(--rule);box-shadow:inset 0 0 0 calc(var(--w)*.04) var(--paper);display:grid;place-items:center}
#push:active{transform:scale(.94)}
#lamp{width:26%;background:oklch(.29 var(--amber,0 0));transition:none}
#lamp.on{background:var(--lit);box-shadow:0 0 .35em var(--lit)}
.label{margin-top:2rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.label p{line-height:1.35}
.label .l{margin-top:.5rem}
.t{font-size:1.1rem}
.m{font-variant-caps:all-small-caps;letter-spacing:.04em}
.d{font-variant-numeric:lining-nums tabular-nums}
#theme{font:inherit;font-size:.85rem;color:var(--amber-base,var(--ink))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
a{color:var(--amber-accent);text-underline-offset:.15em}
.by{margin-top:3rem;text-align:right;font-size:.8rem}
</style>
</head>
<body>
<main>
<div class="corner">
<div id="head" role="img" aria-label="DONT WALK" data-lit="dont">
<svg class="dont" viewBox="0 0 99 99">
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".9"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="dots"><path id="leds" d="M0 0h99v99H0z"/></clipPath>
</defs>
<g><g fill="currentColor"><path d="M42 6h3v3H42zM42 9h6v33H42zM33 12h6v30H33zM51 12h6v30H51z
M24 18h3v3H24zM24 21h6v21H24zM72 39h6v3H72zM24 42h33v12H24zM69 42h6v3H69zM66 45h9v3H66z
M63 48h9v6H63zM24 54h45v3H24zM21 57h48v3H21zM21 60h45v3H21zM24 63h39v3H24zM24 66h36v3H24z
M27 69h30v3H27zM27 72h27v21H27z"/></g></g>
</svg><span class="sr">DONT WALK</span>
<svg class="walk" viewBox="0 0 99 99">
<g><g fill="currentColor"><path d="M51 6h6v3H51zM48 9h12v6H48zM48 15h9v3H48zM42 21h12v3H42z
M36 24h18v3H36zM30 27h27v3H30zM27 30h30v3H27zM27 33h6v9H27zM36 33h21v3H36zM36 36h24v3H36z
M36 39h27v3H36zM27 42h3v9H27zM36 42h15v3H36zM57 42h12v3H57zM33 45h18v9H33zM63 45h9v3H63z
M36 54h15v3H36zM33 57h21v3H33zM33 60h24v3H33zM33 63h9v6H33zM45 63h12v3H45zM48 66h9v3H48z
M30 69h9v9H30zM51 69h9v9H51zM30 78h6v3H30zM54 78h6v3H54zM27 81h9v3H27zM54 81h9v6H54z
M27 84h6v6H27zM57 87h6v3H57zM30 90h3v3H30z"/></g></g>
</svg><span class="sr">WALK</span>
</div>
<div class="post">
<p id="sign">PUSH BUTTON<br>FOR<br>WALK SIGNAL</p>
<button id="push" aria-labelledby="sign"><span id="lamp"></span></button>
</div>
</div>
<p class="sr" id="s" aria-live="polite"></p>
<div class="label">
<div>
<p class="t">doesthisdoanything.click</p>
<p class="m">a button, a light</p>
<p>2026</p>
<p class="d"><span id="self">&ndash;</span> bytes</p>
<p class="l">Wait.</p>
</div>
<button id="theme" hidden>dark</button>
</div>
</main>
<p class="by">by <a href="https://github.com/bonchicbongenre/placebo">bonchicbongenre</a></p>
<script>
// The corner keeps the world's time, so everyone, anywhere, sees the same light at the
// same moment. Each cycle is L seconds: DONT WALK until the traffic lets the WALK come,
// somewhere from lo to hi seconds in; then WALK for 7; then DONT WALK, flashing, for 11.
const{floor,max,random}=Math,$=i=>document.getElementById(i),
  L=45,lo=4,hi=27,WALK=7,FLASH=11,
  head=$("head"),lamp=$("lamp"),s=$("s"),
  calm=matchMedia("(prefers-reduced-motion: reduce)").matches,
  now=()=>Date.now()/1e3,
  // the traffic: one number in [0, 1) for each cycle, the same everywhere
  traffic=k=>{let h=Math.imul(k^0x9e3779b9,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);return((h^h>>>16)>>>0)/2**32},
  say=w=>{s.textContent="";setTimeout(()=>s.textContent=w,100)};
// the lamps are LEDs, 33 by 33 to a lens; each symbol shows only through them. The
// symbols are the US standard ones (MUTCD), sampled LED by LED.
let leds="";
for(let x=1.5;x<99;x+=3)for(let y=1.5;y<99;y+=3)leds+="M"+x+" "+y+"m-1.05 0a1.05 1.05 0 1 0 2.1 0a1.05 1.05 0 1 0-2.1 0";
$("leds").setAttribute("d",leds);

let mine={},call=null,was="";
// when cycle k's WALK comes at this corner
const walkAt=k=>k in mine?mine[k]:lo+(hi-lo)*traffic(k);

// a press lights the lamp until the next WALK, and draws this corner's next WALK
// again, from what the traffic could still give
$("push").onclick=()=>{
  const t=now(),k=floor(t/L),into=t%L,next=into<walkAt(k)?k:k+1,from=next==k?max(into,lo):lo;
  mine[next]=from+random()*(hi-from);
  call=next;lamp.className="on";say("Wait.")};

const draw=()=>{
  const t=now(),k=floor(t/L),into=t%L,a=walkAt(k),
    p=into<a?"":into<a+WALK?"walk":into<a+WALK+FLASH?"flash":"",
    lit=p=="walk"?"walk":p=="flash"&&!calm&&t%1>=.5?"":"dont";
  if(call!=null&&(k>call||k==call&&into>=a)){call=null;lamp.className="";if(p=="walk")say("Walk sign is on.")}
  if(lit!=head.dataset.lit)head.dataset.lit=lit;
  if(p!=was){was=p;head.setAttribute("aria-label",p=="walk"?"WALK":p?"DONT WALK, flashing":"DONT WALK")}
  requestAnimationFrame(draw)};
draw();

// theme: the system's, until the visitor turns it; nothing is kept
const sys=matchMedia("(prefers-color-scheme: dark)"),T=$("theme"),root=document.documentElement,
  dark=()=>root.dataset.theme?root.dataset.theme=="dark":sys.matches,
  turn=()=>T.textContent=dark()?"light":"dark";
sys.addEventListener("change",()=>{if(!root.dataset.theme)turn()});
T.onclick=()=>{root.dataset.theme=dark()?"light":"dark";turn()};
turn();T.hidden=false;

// the page's own size: it asks for itself and counts what comes back (a browser may
// report only the compressed size)
fetch(location.pathname).then(r=>r.arrayBuffer()).then(b=>$("self").textContent=b.byteLength.toLocaleString("en-US"));
console.log("placebo: I shall please.");
</script>
</body>
</html>
